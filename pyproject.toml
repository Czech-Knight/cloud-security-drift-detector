[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-security-drift-detector"
version = "1.0.0"
description = "Explain security-relevant AWS drift against a trusted Terraform baseline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yash"}]
dependencies = ["boto3>=1.35,<2", "pydantic>=2.8,<3"]

[project.optional-dependencies]
web = ["Flask>=3.1,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
drift-detector = "drift_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drift_detector = ["fixtures/*.json", "web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
