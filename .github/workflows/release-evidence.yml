name: Python release evidence

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build, checksum and attest tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Ensure release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f"Expected release tag v{version}; refusing to attach artifacts to a mismatched release")
          PY
      - name: Build source distribution and wheel
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Attest build provenance for release packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.whl,dist/*.tar.gz'
      - name: Attach packages and checksums to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
