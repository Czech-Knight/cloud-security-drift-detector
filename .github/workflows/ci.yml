name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,web]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=drift_detector
      - run: python -m build
      - name: Check packaged offline demo
        shell: bash
        run: |
          python -m venv /tmp/drift-wheel
          /tmp/drift-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/drift-wheel/bin/python -m drift_detector demo --clean --format json
