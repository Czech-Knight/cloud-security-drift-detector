name: Terraform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
      - name: Check enterprise event transport modules
        run: |
          terraform -chdir=deploy/event-hub fmt -check -diff
          terraform -chdir=deploy/event-forwarder fmt -check -diff
          for module in deploy/event-hub deploy/event-forwarder; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done
      # Mock-provider plans above require no AWS access. Live plan/apply stays local,
      # where the real Terraform state is present and the operator reviews changes.
